services:
  - type: web
    name: hospital-queue-webgis
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_SOURCE
        value: memory
      - key: DEMO_USER_ID
        value: 1
