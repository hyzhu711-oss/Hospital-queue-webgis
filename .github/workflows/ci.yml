name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  spatial-agent:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: queuelens_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d queuelens_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/queuelens_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/queuelens_test
      DATABASE_SSL: "false"
      EVAL_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/queuelens_eval
      EVAL_DATABASE_URL: postgresql://queuelens_eval_reader:eval_only_test_password@127.0.0.1:5432/queuelens_eval
      EVAL_READER_PASSWORD: eval_only_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agent-service/requirements.txt
            mcp/requirements.txt
            eval/requirements.txt
            requirements.lock.txt
      - run: npm ci
      - run: python -m pip install -r requirements.lock.txt
      - name: Migrate test database twice
        run: |
          node scripts/migrate.js
          node scripts/migrate.js
      - name: Verify fresh and legacy migration preservation
        run: node scripts/verify-migrations.js
      - name: Existing WebGIS and real PostGIS tests
        run: npm test
      - name: Agent, verifier, session, SSE and actual MCP protocol tests
        working-directory: agent-service
        run: python -m pytest tests -q
      - name: Load isolated deterministic fixture and read-only SQL role
        run: python eval/bootstrap_db.py
      - name: Oracle, metric mutation and SQL isolation tests
        run: python -m pytest eval/tests -q
      - name: PostGIS workflow regression benchmark (rules, no LLM)
        run: python eval/evaluator.py --store postgres --system proposed_rules --system single_step_rules --require-smoke-pass --output eval/reports/run-ci.json
      - name: Upload executable evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-agent-evaluation
          path: eval/reports/run-ci.json
